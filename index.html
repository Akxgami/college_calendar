<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Calendar</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-light: #e8f0fe;
            --bg: #ffffff;
            --bg-page: #f0f2f5;
            --border: #e0e0e0;
            --text-main: #202124;
            --text-muted: #5f6368;
            --today-bg: #e8f0fe;
            --hover-bg: #f8f9fa;
            --shadow-sm: 0 1px 2px rgba(60,64,67,0.1), 0 1px 3px rgba(60,64,67,0.08);
            --shadow-md: 0 2px 6px rgba(60,64,67,0.15), 0 1px 3px rgba(60,64,67,0.1);
            --shadow-lg: 0 8px 24px rgba(60,64,67,0.18);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-page);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }

        .header-divider {
            width: 1px;
            height: 28px;
            background: var(--border);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button {
            cursor: pointer;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        button:hover {
            background: var(--hover-bg);
            border-color: #ccc;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-nav {
            padding: 6px 10px;
            font-size: 16px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-today {
            font-weight: 600;
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .btn-today:hover {
            background: #d2e3fc;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            box-shadow: var(--shadow-sm);
            border-radius: 24px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .btn-primary:hover {
            background: #1765cc;
            box-shadow: var(--shadow-md);
        }

        .month-title {
            font-size: 22px;
            font-weight: 600;
            min-width: 220px;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        /* Calendar Grid */
        .calendar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px 32px 32px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            overflow-y: auto;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--bg);
            border-radius: var(--radius) var(--radius) 0 0;
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 1;
        }

        .weekday-name {
            text-align: center;
            padding: 14px 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .calendar-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(120px, 1fr);
            background: var(--bg);
            border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .day-cell {
            border-right: 1px solid #f0f0f0;
            border-top: 1px solid #f0f0f0;
            padding: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            transition: background 0.15s ease;
            overflow: hidden;
        }

        .day-cell:nth-child(7n) {
            border-right: none;
        }

        .day-cell:hover {
            background: var(--hover-bg);
        }

        .day-cell.other-month {
            background: #fafafa;
        }

        .day-cell.other-month .day-number {
            color: #c4c7cc;
        }

        .day-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 4px;
        }

        .day-number {
            font-size: 13px;
            font-weight: 500;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--text-main);
            transition: all 0.15s;
        }

        .day-cell.today .day-number {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 2px 4px rgba(26,115,232,0.3);
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            max-height: 80px;
        }

        .events-list::-webkit-scrollbar {
            width: 3px;
        }

        .events-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .event-chip {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s, opacity 0.1s;
        }

        .event-chip:hover {
            transform: scale(1.02);
            opacity: 0.92;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal {
            background: #fff;
            border-radius: var(--radius);
            width: 100%;
            max-width: 460px;
            box-shadow: var(--shadow-lg);
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: slideUp 0.2s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 18px;
            padding: 6px 10px;
            color: var(--text-muted);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--hover-bg);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group textarea, .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: #fafafa;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.12);
            background: #fff;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .color-option {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: var(--text-main);
            transform: scale(1.15);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
        }

        .modal-actions button {
            padding: 10px 20px;
        }

        .btn-danger {
            background: #d93025;
            color: #fff;
            border: none;
            margin-right: auto;
            border-radius: 8px;
        }

        .btn-danger:hover {
            background: #b3261e;
        }

        /* Empty state */
        .empty-hint {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.15s;
            pointer-events: none;
        }

        .day-cell:not(.other-month):hover .empty-hint {
            opacity: 0.25;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">📅</div>
                <span>College Calendar</span>
            </div>
            <div class="header-divider"></div>
            <button class="btn-today" onclick="goToToday()">Today</button>
            <div class="nav-controls">
                <button class="btn-nav" onclick="changeMonth(-1)">◀</button>
                <button class="btn-nav" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="month-title" id="monthDisplay"></div>
        </div>
        <button class="btn-primary" onclick="openCreateModal()">
            <span style="font-size:18px;line-height:1">+</span> New Event
        </button>
    </header>

    <div class="calendar-container">
        <div class="weekdays-header">
            <div class="weekday-name">Sun</div>
            <div class="weekday-name">Mon</div>
            <div class="weekday-name">Tue</div>
            <div class="weekday-name">Wed</div>
            <div class="weekday-name">Thu</div>
            <div class="weekday-name">Fri</div>
            <div class="weekday-name">Sat</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- Event Modal -->
    <div class="modal-overlay" id="eventModal" onclick="handleBackdropClick(event)">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitleText">Event Details</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="eventForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="eventId">
                <input type="hidden" id="eventColor" value="#1a73e8">

                <div class="form-group" style="margin-bottom:16px">
                    <label>Title</label>
                    <input type="text" id="eventTitle" placeholder="Add title" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom:16px">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label>Time (Optional)</label>
                        <input type="time" id="eventTime">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:16px">
                    <label>Color</label>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-option selected" style="background: #1a73e8;" data-color="#1a73e8" onclick="selectColor('#1a73e8')"></div>
                        <div class="color-option" style="background: #0b8043;" data-color="#0b8043" onclick="selectColor('#0b8043')"></div>
                        <div class="color-option" style="background: #d93025;" data-color="#d93025" onclick="selectColor('#d93025')"></div>
                        <div class="color-option" style="background: #8e24aa;" data-color="#8e24aa" onclick="selectColor('#8e24aa')"></div>
                        <div class="color-option" style="background: #f4511e;" data-color="#f4511e" onclick="selectColor('#f4511e')"></div>
                        <div class="color-option" style="background: #039be5;" data-color="#039be5" onclick="selectColor('#039be5')"></div>
                        <div class="color-option" style="background: #616161;" data-color="#616161" onclick="selectColor('#616161')"></div>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:20px">
                    <label>Description</label>
                    <textarea id="eventDesc" rows="3" placeholder="Add description or notes"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-danger" id="btnDelete" style="display: none;" onclick="handleDelete()">Delete</button>
                    <button type="button" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" style="border-radius: 8px;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let events = [];

        const escapeHTML = str => str ? str.replace(/[&<>'"]/g,
            tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)) : '';

        async function fetchEvents() {
            try {
                const res = await fetch('/events');
                if (res.ok) {
                    events = await res.json();
                    renderCalendar();
                } else {
                    console.error("Failed to fetch events from database");
                }
            } catch (err) {
                console.error("Error connecting to server:", err);
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            document.getElementById('monthDisplay').textContent = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDateCurrent = new Date(year, month + 1, 0).getDate();
            const lastDatePrev = new Date(year, month, 0).getDate();

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            for (let i = firstDayIndex; i > 0; i--) {
                const dayNum = lastDatePrev - i + 1;
                const prevDateStr = formatDate(year, month - 1, dayNum);
                grid.appendChild(createDayCell(dayNum, prevDateStr, true, false));
            }

            for (let dayNum = 1; dayNum <= lastDateCurrent; dayNum++) {
                const dateStr = formatDate(year, month, dayNum);
                const isToday = isCurrentMonth && today.getDate() === dayNum;
                grid.appendChild(createDayCell(dayNum, dateStr, false, isToday));
            }

            const totalRendered = firstDayIndex + lastDateCurrent;
            const nextDays = (7 - (totalRendered % 7)) % 7;
            for (let dayNum = 1; dayNum <= nextDays; dayNum++) {
                const nextDateStr = formatDate(year, month + 1, dayNum);
                grid.appendChild(createDayCell(dayNum, nextDateStr, true, false));
            }
        }

        function formatDate(year, month, day) {
            const d = new Date(year, month, day);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function createDayCell(dayNum, dateStr, isOtherMonth, isToday) {
            const cell = document.createElement('div');
            cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;
            cell.onclick = (e) => {
                if (e.target.closest('.event-chip')) return;
                openCreateModal(dateStr);
            };

            const header = document.createElement('div');
            header.className = 'day-header';
            header.innerHTML = `<span class="day-number">${dayNum}</span>`;
            cell.appendChild(header);

            const eventsList = document.createElement('div');
            eventsList.className = 'events-list';

            const dayEvents = events.filter(ev => ev.date === dateStr);
            dayEvents.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

            dayEvents.forEach(ev => {
                const chip = document.createElement('div');
                chip.className = 'event-chip';
                chip.style.backgroundColor = ev.color || '#1a73e8';
                const timeText = ev.time ? `${escapeHTML(ev.time)} ` : '';
                chip.innerHTML = `<span>${timeText}<strong>${escapeHTML(ev.title)}</strong></span>`;
                chip.onclick = (e) => {
                    e.stopPropagation();
                    openEditModal(ev);
                };
                eventsList.appendChild(chip);
            });

            cell.appendChild(eventsList);

            // "+" hint on hover for empty days
            if (dayEvents.length === 0 && !isOtherMonth) {
                const hint = document.createElement('span');
                hint.className = 'empty-hint';
                hint.textContent = '+';
                cell.appendChild(hint);
            }

            return cell;
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        function openCreateModal(dateStr = '') {
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = '';
            document.getElementById('modalTitleText').textContent = 'Create Event';
            document.getElementById('btnDelete').style.display = 'none';
            selectColor('#1a73e8');

            if (dateStr) {
                document.getElementById('eventDate').value = dateStr;
            } else {
                const now = new Date();
                document.getElementById('eventDate').value = formatDate(now.getFullYear(), now.getMonth(), now.getDate());
            }

            document.getElementById('eventModal').style.display = 'flex';
            document.getElementById('eventTitle').focus();
        }

        function openEditModal(ev) {
            document.getElementById('eventId').value = ev.id;
            document.getElementById('modalTitleText').textContent = 'Edit Event';
            document.getElementById('eventTitle').value = ev.title;
            document.getElementById('eventDate').value = ev.date;
            document.getElementById('eventTime').value = ev.time || '';
            document.getElementById('eventDesc').value = ev.description || '';
            document.getElementById('btnDelete').style.display = 'block';
            selectColor(ev.color || '#1a73e8');

            document.getElementById('eventModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
        }

        function handleBackdropClick(e) {
            if (e.target.id === 'eventModal') closeModal();
        }

        function selectColor(color) {
            document.getElementById('eventColor').value = color;
            document.querySelectorAll('.color-option').forEach(el => {
                el.classList.toggle('selected', el.getAttribute('data-color') === color);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('eventId').value;
            const payload = {
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                time: document.getElementById('eventTime').value,
                description: document.getElementById('eventDesc').value,
                color: document.getElementById('eventColor').value
            };

            const url = id ? `/events/${id}` : '/events';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    closeModal();
                    await fetchEvents();
                } else {
                    const err = await res.json();
                    alert('Error saving event: ' + (err.detail || 'Unknown error'));
                }
            } catch (err) {
                alert('Failed to connect to server');
            }
        }

        async function handleDelete() {
            const id = document.getElementById('eventId').value;
            if (!id || !confirm('Are you sure you want to delete this event?')) return;

            try {
                const res = await fetch(`/events/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    closeModal();
                    await fetchEvents();
                } else {
                    alert('Error deleting event');
                }
            } catch (err) {
                alert('Failed to connect to server');
            }
        }

        fetchEvents();
    </script>
</body>
</html>
